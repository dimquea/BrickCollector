# BrickCollector в обычном контейнере.
#
# Отличие от аддона одно и важное: здесь порт выставлен наружу, поэтому
# заголовку X-Ingress-Path верить нельзя — его может прислать кто угодно, а он
# переписывает все ссылки на странице. Переменная не передаётся вовсе.

user root;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Картинки отдаются приложением, справочник импортируется долго: короткий
    # таймаут превратил бы первый импорт в 504.
    fastcgi_read_timeout 600;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        server_name _;
        root /app/public;
        index index.php;

        client_max_body_size 32m;

        # Собранные ассеты именуются по содержимому, поэтому их можно кэшировать
        # надолго: смена сборки меняет имя файла.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /\. {
            deny all;
        }
    }
}
