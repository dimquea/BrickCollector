; Пул для BrickCollector. Базовый www удалён в Dockerfile, чтобы не спорил за
; тот же порт.
[brickcollector]
listen = 127.0.0.1:9000

; От root, как и всё в этом контейнере: база и кэш картинок лежат в /data,
; который принадлежит root. php-fpm отказывается запускать пул от root, если
; ему явно не сказать -R, — сказано в entrypoint.sh.
user = root
group = root

; Контейнер может жить и на домашнем сервере, и на Raspberry Pi: держим
; немного готовых процессов и не даём пулу разрастаться.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Без этого php-fpm вычищает окружение воркеров, и приложение не узнает, где
; лежит база.
clear_env = no

; Импорт справочника — 175 тысяч предметов и полтора миллиона строк описи; на
; слабой машине это минуты и сотня мегабайт. Пересборка описей коллекции тоже
; не укладывается в тридцать секунд по умолчанию.
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 600

catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
